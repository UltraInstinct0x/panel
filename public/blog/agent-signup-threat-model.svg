<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agent signup threat model">
  <rect width="1200" height="630" fill="#0a0f1a"/>
  <text x="60" y="90" fill="#67e8f9" font-family="JetBrains Mono, monospace" font-size="34">agent signup threat model</text>
  <rect x="80" y="150" width="280" height="120" rx="10" fill="#111827" stroke="#4b5563"/>
  <text x="115" y="205" fill="#e5e7eb" font-family="JetBrains Mono, monospace" font-size="20">authorized agent</text>
  <text x="115" y="235" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="16">admit + tag + throttle</text>
  <rect x="460" y="150" width="280" height="120" rx="10" fill="#111827" stroke="#4b5563"/>
  <text x="510" y="205" fill="#e5e7eb" font-family="JetBrains Mono, monospace" font-size="20">fake agent</text>
